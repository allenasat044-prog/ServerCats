# LabServer configuration. Sourced by every script in server/ (bash syntax).
# An empty value means "leave this alone / skip this step". Nothing here is applied
# until you run a module with --apply (plain `labctl <module>` only prints a plan).

# ---- Layout ------------------------------------------------------------------
LAB_BASE=/srv/lab                    # shared folders, temp area and backups live under here
STATE_DIR=/var/lib/labserver         # records of real runs (backup, cleanup, update)
DEPARTMENTS="cse ece mech civil"     # one group (lab-<dept>) and one shared folder each

# ---- System: hostname, network, software ------------------------------------
LAB_HOSTNAME=""                      # set to rename this machine
NET_IFACE=""                         # static IP: all four values must be set, otherwise
NET_ADDRESS=""                       #   the current (DHCP) network configuration is kept.
NET_GATEWAY=""                       #   NET_ADDRESS is CIDR, NET_DNS is space separated.
NET_DNS=""
PACKAGES="build-essential python3 python3-pip default-jdk git nodejs npm vim curl acl lvm2 parted ufw rsync cron libpam-pwquality"

# ---- Users and passwords -----------------------------------------------------
PASSWORD_MAX_DAYS=180                # accounts must change their password this often

# ---- Storage -----------------------------------------------------------------
EXTEND_ROOT=no                       # yes = grow / into unallocated space of its volume group
DATA_DISK=""                         # whole empty disk to partition + LVM + mount
LVM_VG=labvg
LVM_LV=labdata
LVM_SIZE="100%FREE"                  # 100%FREE or a size such as 200G
LVM_FS=ext4
LVM_MOUNT=/srv/lab                   # where the new volume is mounted

# ---- Backup and cleanup ------------------------------------------------------
BACKUP_SOURCES="/srv/lab/shared /home"
BACKUP_KEEP=7                        # newest archives kept
CLEANUP_DAYS=7                       # files in $LAB_BASE/tmp older than this are deleted

# ---- Automation (cron schedules) ---------------------------------------------
STATUS_CRON="*/5 * * * *"            # refresh the website data
BACKUP_CRON="30 1 * * *"
CLEANUP_CRON="0 3 * * *"
UPDATE_CRON="0 4 * * 0"              # OS updates, Sundays

# ---- Security ----------------------------------------------------------------
FIREWALL_ALLOW_TCP=""                # extra TCP ports to open besides SSH (space separated)
SSH_PERMIT_ROOT=no
SSH_PASSWORD_AUTH=yes                # set to no only after SSH keys are installed
SSH_MAX_AUTH_TRIES=3
SSH_ALLOW_GROUPS=""                  # empty = no group restriction
